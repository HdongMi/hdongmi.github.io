<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>사무직 생존템 운영 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 토스 스타일: 회색 바탕 위 흰 카드, 큰 숫자, 파란 포인트 하나 */
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --fg:#191F28; --sub:#4E5968; --muted:#8B95A1; --line:#E5E8EB; --soft:#F9FAFB;
  --blue:#3182F6; --blue-soft:#E8F3FF; --daily:#3182F6; --follow:#00B8A9; --money:#FF8A00; --done:#03B26C;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101013; --card:#1C1C21; --fg:#F2F4F6; --sub:#B0B8C1; --muted:#7E8792; --line:#2C2C35; --soft:#24242B;
  --blue:#4C9AFF; --blue-soft:#1B2A44; --daily:#4C9AFF; --follow:#1FD1C1; --money:#FF9F2E; --done:#2DD488; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --card:#1C1C21; --fg:#F2F4F6; --sub:#B0B8C1; --muted:#7E8792; --line:#2C2C35; --soft:#24242B;
  --blue:#4C9AFF; --blue-soft:#1B2A44; --daily:#4C9AFF; --follow:#1FD1C1; --money:#FF9F2E; --done:#2DD488; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:12px}
header{padding:8px 4px 4px}
header .eyebrow{font-size:13px;color:var(--muted);font-weight:600}
header h1{font-size:24px;line-height:1.35;margin:6px 0 0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.card{background:var(--card);border-radius:20px;padding:22px 20px}
.card h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.card .desc{font-size:14px;color:var(--muted);margin:0 0 16px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);font-weight:600;margin-left:2px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 10px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;min-width:4px}
.next{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:14px;margin-top:16px}
.next .ic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.next b{display:block;font-size:15px}
.next span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;padding:18px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.mix{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;margin:4px 0 14px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:10px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.legend .p{color:var(--muted);font-size:13px;width:38px;text-align:right}
.weekdays,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdays div{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{aspect-ratio:1/1.12;max-width:100%;border:0;border-radius:12px;background:var(--soft);color:var(--fg);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;position:relative}
.cell:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cell .d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cell .t{width:6px;height:6px;border-radius:50%}
.cell.empty{background:transparent;cursor:default}
.cell.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cell.posted{background:var(--blue-soft)}
.cell.posted::after{content:"✓";position:absolute;top:3px;right:6px;font-size:10px;color:var(--done);font-weight:700}
.cell.money .d{color:var(--money)}
.phase{display:flex;gap:8px;margin-top:14px}
.phase div{flex:1;background:var(--soft);border-radius:12px;padding:12px}
.phase b{display:block;font-size:14px}
.phase span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0;padding-top:4px}
.row .ic{width:42px;height:42px;border-radius:50%;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.row .ic b{font-size:14px;color:var(--money)}
.row .ic span{font-size:10px;color:var(--muted)}
.row .mid{min-width:0;flex:1}
.row .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:13px;color:var(--muted)}
.row .r{text-align:right;flex:none}
.row .r b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.row .r span{font-size:12px;color:var(--blue);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.chip em{font-style:normal;color:var(--blue);margin-left:4px}
.empty-state{text-align:center;padding:18px 8px 6px;color:var(--muted);font-size:14px;line-height:1.6}
.empty-state b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:8px;line-height:1.6}
/* 바텀시트 */
.sheet-bg{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:12px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;margin-right:6px}
.sheet h3{font-size:20px;margin:12px 0 4px}
.sheet .meta{font-size:13px;color:var(--muted)}
.post{white-space:pre-wrap;background:var(--soft);border-radius:16px;padding:16px;font-size:15px;line-height:1.65;margin:16px 0}
.kv{display:flex;flex-direction:column;gap:10px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;text-align:right;word-break:break-all}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:15px;margin-top:20px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="updated"></div>
    <h1>사무직 생존템<br>쓰레드 운영 현황</h1>
  </header>

  <section class="card" aria-label="진행률">
    <div class="desc" style="margin:0">30일 플랜 진행률</div>
    <div class="big" id="dayBig"></div>
    <div class="bar"><i id="prog"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span id="progL"></span><span id="progR"></span></div>

  <section class="card">

    <div class="mix" id="mix"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <h2>30일 달력</h2>
    <p class="desc">날짜를 누르면 그날 올라갈 글을 볼 수 있어요</p>

  </section>

  <section class="card">

  </section>

  <section class="card">
    <h2>톤 테스트</h2>

    <div class="chips" id="tones"></div>
  </section>

  <section class="card">
    <h2>성과</h2>
    <div class="empty-state"><b>아직 쌓인 데이터가 없어요</b>조회수와 클릭 수는 글이 올라가기 시작하면<br>여기에 모아서 보여드릴게요</div>
  </section>

  <footer>가격은 쿠팡파트너스에서 링크를 만든 날 기준이에요<br>사진·영상 Pixabay</footer>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grab"></div>
    <div id="sTags"></div>
    <h3 id="sTitle"></h3>
    <div class="meta" id="sMeta"></div>
    <div class="post" id="sBody"></div>
    <div class="kv" id="sKv"></div>
    <div id="sBtns"></div>
  </div>
</div>

let lastFocus = null;
function openSheet(day){
  const p = posts.find(x => x.day === day); const dt = dateOf(day);
  lastFocus = document.activeElement;
  $("sTags").innerHTML = `<span class="tag" style="background:var(--soft);color:${TYPE[p.type].c}">${TYPE[p.type].n}</span>` +
    (p.tone && p.type === "수익화" ? `<span class="tag" style="background:var(--soft);color:var(--sub)">${p.tone}</span>` : "") +
    (p.posted_at ? `<span class="tag" style="background:var(--soft);color:var(--done)">게시 완료</span>` : "");
  $("sTitle").textContent = `${p.day}일차 · ${md(dt)}(${WD[dt.getDay()]})`;
  $("sMeta").textContent = p.posted_at ? `${p.posted_at}에 올라갔어요` : "12:10~12:45 사이에 자동으로 올라가요";
  $("sBody").textContent = (p.type === "수익화" ? "[광고] " : "") + p.body;
  const kv = [];
  if (p.media_type) kv.push(["첨부", (p.media_type === "video" ? "영상" : "사진") + " · Pixabay"]);
  if (p.product_name) kv.push(["상품", p.product_name]);
  if (p.price) kv.push(["가격", won(p.price) + " (링크 만든 날 기준)"]);
  if (p.type === "수익화") kv.push(["첫 댓글", "쿠팡 링크 + 공정위 문구"]);
  $("sKv").innerHTML = kv.map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("");
  $("sBtns").innerHTML = p.links.map(l => `<a class="btn" href="${l.url}" target="_blank" rel="noopener sponsored">${l.label ? l.label + " 상품 보기" : "쿠팡에서 상품 보기"}</a>`).join("")
    + `<button class="btn ghost" id="sClose">닫기</button>`;
  $("sheetBg").hidden = false;
  $("sClose").focus();
  $("sClose").onclick = closeSheet;
}
function closeSheet(){ $("sheetBg").hidden = true; if (lastFocus) lastFocus.focus(); }
$("cal").addEventListener("click", e => { const b = e.target.closest("button[data-day]"); if (b) openSheet(+b.dataset.day); });
$("sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheetBg").hidden) closeSheet(); });
</script>
</body>
</html>
